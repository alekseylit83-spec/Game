<!DOCTYPE html>
<!--
  ВЕСЁЛЫЙ ПОВАР — ретро 8-битная браузерная игра. Весь проект — в этом одном файле:
  без библиотек, без картинок и шрифтов, без обращений в интернет (работает офлайн).
  Графика (спрайты, кухня, шрифт с кириллицей) и звук (Web Audio) нарисованы и синтезируются в коде.
  Управление: стрелки ← → (или A / D) — двигаться, Пробел — старт, P — пауза, M — звук.
  В телефоне и планшете вместо клавиш появляются кнопки на экране: ход, прыжок, удар, пауза, звук.
  За каждые 100 очков приходит заказ: на кухню выбегает официант, и когда он скажет «заказ», сверху падает новое блюдо.
  Когда блюд становится четыре, повар кричит «забирай заказ», и официант забирает два блюда.
  Столкнёшься с официантом — повар оглушён, а комбо сбито.
  После каждых двух уровней повар выходит на огород: собирает 30 овощей (↑ прыжок, Пробел удар сковородкой),
  перепрыгивает камни, давит колорадских жуков и возвращается на кухню. Очки дают дополнительные жизни.
  Для GitHub Pages достаточно выложить этот index.html.
-->

<script>
'use strict';
/* =====================================================================
   ПАЛИТРА — 20 цветов на всю игру (как на старой приставке)
   ===================================================================== */
const PAL = {
  k: '#0d0b1a',  // чернила (контуры)
  n: '#2a2745',  // ночь
  s: '#57567a',  // сланец
  f: '#9d9cbf',  // туман
  l: '#d9d7ea',  // светлая тень
  w: '#f7f3e8',  // сливочный белый
  R: '#e8443a',  // красный
  r: '#a8232f',  // тёмно-красный
  o: '#f08a24',  // оранжевый
  y: '#f7d23e',  // жёлтый
  G: '#62c84a',  // зелёный
  g: '#237a3b',  // тёмно-зелёный
  B: '#5aa8ec',  // небесный
  b: '#2b4aa8',  // синий
  V: '#9cd0f8',  // светло-голубой
  v: '#3c82c8',  // средне-голубой
  C: '#b8743a',  // карамель
  c: '#6b3a1e',  // шоколад
  p: '#f7b48a',  // кожа
  P: '#f078a8'   // розовый
};

/* ===================== Помощники для пиксель-арта ===================== */
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// Строки символов -> canvas. sym=true: строки заданы левой половиной (с центром) и зеркалятся.
function spriteFromRows(rows, sym) {
  const full = sym ? rows.map(r => r + r.slice(0, -1).split('').reverse().join('')) : rows;
  const w = full[0].length, h = full.length;
  const c = mkCanvas(w, h), x = c.getContext('2d');
  for (let j = 0; j < h; j++) {
    if (full[j].length !== w) throw new Error('Спрайт: ширина строки ' + j + ' = ' + full[j].length + ', ожидалось ' + w);
    for (let i = 0; i < w; i++) {
      const ch = full[j][i];
      if (ch === '.') continue;
      if (!PAL[ch]) throw new Error('Спрайт: неизвестный цвет "' + ch + '"');
      x.fillStyle = PAL[ch];
      x.fillRect(i, j, 1, 1);
    }
  }
  return c;
}

function flipH(src) {
  const c = mkCanvas(src.width, src.height), x = c.getContext('2d');
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}

// Поворот на 90° по часовой стрелке — попиксельно, без сглаживания
function rot90(src) {
  const w = src.width, h = src.height;
  const s = src.getContext('2d').getImageData(0, 0, w, h);
  const c = mkCanvas(h, w), x = c.getContext('2d');
  const d = x.createImageData(h, w);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const si = (y * w + i) * 4, di = (i * h + (h - 1 - y)) * 4;
    d.data[di] = s.data[si]; d.data[di + 1] = s.data[si + 1];
    d.data[di + 2] = s.data[si + 2]; d.data[di + 3] = s.data[si + 3];
  }
  x.putImageData(d, 0, 0);
  return c;
}
function frames4(c) { const a = c, b = rot90(a), d = rot90(b), e = rot90(d); return [a, b, d, e]; }

// Мини-редактор: сетка символов + фигуры + автоконтур
class PX {
  constructor(w, h) { this.w = w; this.h = h; this.g = Array.from({ length: h }, () => new Array(w).fill('.')); }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? '.' : this.g[y][x]; }
  px(x, y, c, over) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return this;
    if (over !== undefined && this.g[y][x] !== over) return this;
    this.g[y][x] = c; return this;
  }
  rect(x, y, w, h, c, over) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c, over); return this; }
  ell(cx, cy, rx, ry, c, over) {
    for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
      for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
        const dx = (x - cx) / (rx + 0.4), dy = (y - cy) / (ry + 0.4);
        if (dx * dx + dy * dy <= 1) this.px(x, y, c, over);
      }
    return this;
  }
  line(x0, y0, x1, y1, c, over) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      this.px(x0, y0, c, over);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
    return this;
  }
  // капсула: отрезок с радиусом (толстая линия со скруглёнными концами)
  cap(x0, y0, x1, y1, r, c, over) {
    const minx = Math.floor(Math.min(x0, x1) - r - 1), maxx = Math.ceil(Math.max(x0, x1) + r + 1);
    const miny = Math.floor(Math.min(y0, y1) - r - 1), maxy = Math.ceil(Math.max(y0, y1) + r + 1);
    const vx = x1 - x0, vy = y1 - y0, L2 = vx * vx + vy * vy || 1;
    for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
      let t = ((x - x0) * vx + (y - y0) * vy) / L2; t = Math.max(0, Math.min(1, t));
      const px = x0 + t * vx - x, py = y0 + t * vy - y;
      if (px * px + py * py <= (r + 0.4) * (r + 0.4)) this.px(x, y, c, over);
    }
    return this;
  }
  tri(x0, y0, x1, y1, x2, y2, c, over) {
    const minx = Math.floor(Math.min(x0, x1, x2)), maxx = Math.ceil(Math.max(x0, x1, x2));
    const miny = Math.floor(Math.min(y0, y1, y2)), maxy = Math.ceil(Math.max(y0, y1, y2));
    const den = (y1 - y2) * (x0 - x2) + (x2 - x1) * (y0 - y2);
    for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
      const a = ((y1 - y2) * (x - x2) + (x2 - x1) * (y - y2)) / den;
      const b = ((y2 - y0) * (x - x2) + (x0 - x2) * (y - y2)) / den;
      const g = 1 - a - b, e = -0.08;
      if (a >= e && b >= e && g >= e) this.px(x, y, c, over);
    }
    return this;
  }
  // нижняя кромка фигуры темнее — объём
  shadeBottom(from, to) {
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++)
      if (this.g[y][x] === from && this.get(x, y + 1) === '.') this.g[y][x] = to;
    return this;
  }
  outline(c) {
    c = c || 'k';
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.g[y][x] !== '.') continue;
      if (this.get(x - 1, y) !== '.' || this.get(x + 1, y) !== '.' || this.get(x, y - 1) !== '.' || this.get(x, y + 1) !== '.') add.push([x, y]);
    }
    for (const [x, y] of add) this.g[y][x] = c;
    return this;
  }
  rows() { return this.g.map(r => r.join('')); }
  canvas() { return spriteFromRows(this.rows(), false); }
}

/* ========================= ПОВАР ========================= */
// Верхняя часть: колпак, лицо, китель (левая половина + центр, зеркалится)
const COOK_ROWS = [
  '.......kkkk',
  '....kkkwwww',
  '...kwwwwwww',
  '..kwwwwlwww',
  '..kwwwwlwww',
  '..kwwwwlwww',
  '..kwwwwlwww',
  '...kwwlwwww',
  '....kwwwwww',
  '....kkkkkkk',
  '....kwwwwww',
  '....kllllll',
  '....kkkkkkk',
  '.....kppppp',
  '.....kpccpp',
  '.....kppkpp',
  '.....kppkpp',
  '.....kPPpRR',
  '.....kcccRR',
  '.....kccccc',
  '......kprrr',
  '.......kkkk',
  '.....kRRRRR',
  '...kkwwwwwR',
  '..kwwwwwwwR',
  '..kwwwwwwwl',
  '..kwwwwwwwk',
  '..kwwwwwwwl',
  '..kwwwwwwwk',
  '..kwwwwwwwl',
  '..kwwwwwlll',
  '..kkkkkkkkk'
];
// Нога (носок смотрит влево); правая — зеркальная
const LEG_ROWS = [
  '..kbbbbbk',
  '..kbvbbbk',
  '..kbvbbbk',
  '..kbvbbbk',
  '..kbbbbbk',
  '..kbbbbbk',
  '.kkbbbbbk',
  'kcccccccck'.slice(0, 9),
  'kkkkkkkkk'
];

// Сковородка: ручка слева, эллипс справа (в профиль, слегка сверху)
function mkPan() {
  const p = new PX(32, 9);
  // ручка
  p.rect(1, 3, 8, 2, 'c'); p.rect(1, 3, 8, 1, 'C');
  // тело сковороды
  p.ell(20, 4, 12, 3, 's');
  p.ell(20, 3, 11, 2, 'f');       // светлый ободок
  p.ell(20, 3, 9, 1.4, 'n');      // тёмная внутренность
  p.shadeBottom('s', 'n');
  p.outline('k');
  return p.canvas();
}

/* ========================= ЕДА ========================= */
function mkSausage() {
  const p = new PX(18, 9);
  p.cap(4, 4, 13, 4, 3, 'R');
  p.line(4, 2, 12, 2, 'P', 'R');
  p.line(4, 6, 13, 6, 'r', 'R');
  for (const x of [6, 9, 12]) { p.px(x, 3, 'r', 'R'); p.px(x + 1, 4, 'r', 'R'); p.px(x + 2, 5, 'r', 'R'); }
  p.outline('k');
  return p.canvas();
}
function mkFish() {
  const p = new PX(20, 13);
  p.tri(7, 6, 1, 1, 1, 11, 'o');                // хвост
  p.tri(9, 3, 13, 3, 12, 0, 'o');               // плавник сверху
  p.ell(12, 6, 6, 4, 'y');                      // тело
  p.ell(12, 4, 5, 1, 'o', 'y');                 // спинка
  p.ell(12, 8, 5, 1.2, 'w', 'y');               // брюшко
  p.px(16, 5, 'w'); p.px(17, 5, 'k');           // глаз
  for (const y of [4, 5, 6, 7]) p.px(14, y, 'o', 'y');   // жабра
  for (const [x, y] of [[10, 5], [8, 6], [10, 7], [12, 6]]) p.px(x, y, 'o', 'y');   // чешуя
  p.outline('k');
  return p.canvas();
}
function mkEgg() {
  const p = new PX(16, 13);
  p.ell(6, 6, 5, 4, 'w'); p.ell(10, 7, 4, 3, 'w'); p.ell(5, 9, 3, 2, 'w');
  p.shadeBottom('w', 'l');
  p.ell(7, 5, 2.2, 2.2, 'y');
  p.px(8, 6, 'o'); p.px(7, 6, 'o'); p.px(6, 4, 'w');
  p.outline('k');
  return p.canvas();
}
function mkSteak() {
  const p = new PX(18, 14);
  p.ell(8, 7, 7, 5, 'c');
  p.ell(8, 7, 6, 4, 'C');
  p.line(4, 4, 9, 9, 'c', 'C'); p.line(7, 3, 12, 8, 'c', 'C'); p.line(3, 7, 6, 10, 'c', 'C'); p.line(10, 3, 13, 6, 'c', 'C');
  p.ell(12, 9, 2, 1.6, 'w'); p.px(12, 9, 'l');    // косточка
  p.outline('k');
  return p.canvas();
}
function mkDrumstick() {
  const p = new PX(19, 19);
  p.cap(10, 10, 15, 15, 1.3, 'w');                 // косточка
  p.ell(16, 15, 1.8, 1.8, 'w'); p.ell(15, 17, 1.6, 1.6, 'w'); p.ell(17, 13, 1.4, 1.4, 'w');
  p.ell(6, 6, 5, 5, 'C');
  p.ell(5, 5, 2.2, 2.2, 'y', 'C');                 // золотистая корочка
  p.shadeBottom('C', 'c');
  p.line(9, 4, 9, 9, 'c', 'C'); p.line(4, 9, 8, 9, 'c', 'C');
  p.outline('k');
  return p.canvas();
}

function mkToqueIcon() {            // значок жизни: колпак с красной лентой
  const p = new PX(11, 10);
  p.ell(3, 4, 2.6, 2.6, 'w'); p.ell(7, 4, 2.6, 2.6, 'w'); p.ell(5, 3.6, 3, 3, 'w');
  p.rect(2, 6, 7, 1, 'w');
  p.shadeBottom('w', 'l');
  p.rect(2, 7, 7, 2, 'R'); p.rect(2, 8, 7, 1, 'r');
  p.outline('k');
  return p.canvas();
}

/* ========================= КОТ ========================= */
function mkCatSit() {
  const p = new PX(19, 24);
  p.ell(9, 17, 6, 5, 'o');                        // туловище
  p.ell(9, 17, 3, 4, 'w');                        // грудка
  p.ell(9, 9, 7, 5, 'o');                         // голова
  p.tri(2, 5, 8, 4, 3, 0, 'o'); p.tri(16, 5, 10, 4, 15, 0, 'o');  // уши
  p.tri(3, 4, 5, 4, 3, 2, 'P'); p.tri(15, 4, 13, 4, 15, 2, 'P');
  p.ell(5, 11, 2, 1.2, 'w'); p.ell(13, 11, 2, 1.2, 'w');       // щёки
  p.px(7, 5, 'r'); p.px(9, 5, 'r'); p.px(11, 5, 'r'); p.px(9, 6, 'r');   // полоски
  p.rect(5, 8, 2, 2, 'G'); p.rect(12, 8, 2, 2, 'G');
  p.px(6, 8, 'k'); p.px(6, 9, 'k'); p.px(12, 8, 'k'); p.px(12, 9, 'k');  // зрачки
  p.px(9, 11, 'P'); p.px(9, 12, 'k'); p.px(8, 13, 'k'); p.px(10, 13, 'k');
  p.rect(6, 20, 3, 2, 'w'); p.rect(10, 20, 3, 2, 'w');          // лапки
  p.outline('k');
  return p.canvas();
}
function mkCatTail(frame) {
  const p = new PX(9, 14);
  if (frame === 0) { p.cap(1, 12, 3, 6, 1.1, 'o'); p.cap(3, 6, 6, 2, 1.1, 'o'); p.px(6, 2, 'r'); }
  else { p.cap(1, 12, 4, 8, 1.1, 'o'); p.cap(4, 8, 7, 8, 1.1, 'o'); p.px(7, 8, 'r'); }
  p.outline('k');
  return p.canvas();
}
// Бег: голова слева

      tone(b, 0.07, { vol: 0.14 });
      tone(b * 1.5, 0.12, { vol: 0.12, at: t + 0.06 });
      noise(0.14, { freq: 5500, vol: 0.05 });          // шипение сковородки
      if (perfect) tone(b * 2, 0.14, { type: 'triangle', vol: 0.14, at: t + 0.13 });
    }),
    drop: safe(() => tone(280, 0.38, { type: 'sawtooth', slideTo: 55, vol: 0.12 })),
    meow: safe(() => {
      const t = ctx.currentTime;
      tone(680, 0.13, { type: 'triangle', slideTo: 980, vol: 0.17, at: t });
      tone(980, 0.28, { type: 'triangle', slideTo: 520, vol: 0.17, at: t + 0.12 });
    }),
    chomp: safe(() => noise(0.06, { filter: 'lowpass', freq: 900, vol: 0.2 })),
    level: safe(() => seq([523, 659, 784, 1047, 1319], 0.085, { vol: 0.12 })),
    life: safe(() => seq([784, 988, 1175, 1568], 0.08, { vol: 0.12, type: 'triangle' })),
    start: safe(() => seq([392, 523, 659, 784, 1047], 0.09, { vol: 0.12 })),
    over: safe(() => seq([392, 370, 349, 330, 262, 196], 0.17, { vol: 0.14, type: 'triangle', len: 0.3 })),
    bell: safe(() => { const t = ctx.currentTime; tone(1568, 0.12, { type: 'triangle', vol: 0.12, at: t }); tone(1175, 0.24, { type: 'triangle', vol: 0.12, at: t + 0.12 }); }),
    bump: safe(() => {
      noise(0.16, { filter: 'lowpass', freq: 700, vol: 0.3 });
      tone(190, 0.3, { type: 'sawtooth', slideTo: 45, vol: 0.14 });
      noise(0.25, { freq: 6000, vol: 0.06, at: ctx.currentTime + 0.05 });     // звон посуды
    }),
    pick: safe((streak) => { const b = 780 + Math.min(streak || 0, 20) * 24, t = ctx.currentTime; tone(b, 0.06, { vol: 0.12 }); tone(b * 1.5, 0.1, { vol: 0.11, at: t + 0.05 }); }),
    jump: safe(() => tone(330, 0.16, { slideTo: 720, vol: 0.1 })),
    swing: safe(() => noise(0.13, { filter: 'bandpass', freq: 1800, vol: 0.14 })),
    squash: safe(() => { tone(240, 0.14, { slideTo: 60, vol: 0.13 }); noise(0.08, { filter: 'lowpass', freq: 1200, vol: 0.18 }); }),
    harvest: safe(() => seq([392, 494, 587, 784, 988], 0.08, { vol: 0.11, type: 'triangle' })),
    done: safe(() => seq([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.09, { vol: 0.12 })),
    blip: safe(() => { tone(500, 0.05, { vol: 0.1 }); tone(750, 0.07, { vol: 0.1, at: ctx.currentTime + 0.05 }); }),
    fall: safe(() => tone(1000, 0.3, { type: 'triangle', slideTo: 380, vol: 0.09 })),      // свист падающего блюда
    shout: safe(() => { const t = ctx.currentTime; tone(520, 0.09, { slideTo: 700, vol: 0.13, at: t }); tone(700, 0.18, { slideTo: 980, vol: 0.13, at: t + 0.1 }); })   // «эй!» повара
  };

  /* ---------- Музыка: весёлая полька на две дорожки + «хэт» ---------- */
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function midi(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n); return 12 * (+m[3] + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); }
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function prepTrack(melRows, bass) {                 // разбираем мелодию: '-' продлевает ноту, '.' — пауза
    const mel = melRows.join(' ').split(' '), leadAt = {};
    mel.forEach((tok, i, arr) => {
      if (tok === '.' || tok === '-') return;
      let len = 1; while (arr[i + len] === '-') len++;
      leadAt[i] = { m: midi(tok), len };
    });
    return { len: mel.length, leadAt, bass };
  }
  const TRACKS = [
    prepTrack([                                       // 0: кухня — весёлая полька
      'E5 - G5 E5 C5 E5 G5 -', 'A5 - G5 E5 C5 D5 E5 -', 'F5 - A5 F5 C5 F5 A5 -', 'G5 - E5 C5 D5 . G4 .',
      'D5 - G5 D5 B4 D5 G5 -', 'B5 - A5 G5 F5 E5 D5 -', 'E5 - G5 E5 C5 E5 G5 C6', 'B5 A5 G5 F5 E5 . C5 .'
    ], [['C3', 'G3'], ['C3', 'G3'], ['F2', 'C3'], ['C3', 'G3'], ['G2', 'D3'], ['G2', 'D3'], ['C3', 'G3'], ['G2', 'C3']]),
    prepTrack([                                       // 1: огород — бодрая прогулка
      'D5 - G5 - B5 G5 D5 -', 'E5 - G5 - B5 G5 E5 -', 'C5 - E5 - G5 E5 C5 -', 'D5 - F#5 - A5 F#5 D5 -',
      'B5 - A5 G5 B5 - D6 -', 'B5 - G5 E5 G5 - B5 -', 'A5 - C6 - B5 A5 G5 -', 'F#5 A5 D6 A5 F#5 - D5 .'
    ], [['G2', 'D3'], ['E2', 'B2'], ['C3', 'G3'], ['D3', 'A3'], ['G2', 'D3'], ['E2', 'B2'], ['A2', 'E3'], ['D3', 'A3']])
  ];
  let T = TRACKS[0];
  let step = 0, next = 0, timer = null, playing = false, bpm = 132;
  function stepDur() { return 60 / bpm / 2; }
  function schedule(i, t) {
    const sd = stepDur(), e = T.leadAt[i];
    if (e) tone(hz(e.m), e.len * sd * 0.94, { type: 'pulse', vol: 0.075, at: t, bus: musBus, hold: true });
    if (i % 2 === 0) {
      const n = T.bass[i >> 3][(i >> 1) & 1];
      tone(hz(midi(n)), sd * 1.8, { type: 'triangle', vol: 0.2, at: t, bus: musBus, hold: true });
    } else noise(0.03, { freq: 7500, vol: 0.035, at: t, bus: musBus });
  }
  function pump() {
    if (!ctx) return;
    if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
    while (next < ctx.currentTime + 0.2) { schedule(step, next); next += stepDur(); step = (step + 1) % T.len; }
  }
  const music = {
    start() { if (!ctx || playing) return; playing = true; next = ctx.currentTime + 0.08; timer = setInterval(pump, 40); },
    rewind() { step = 0; },
    stop() { playing = false; if (timer) { clearInterval(timer); timer = null; } },
    tempo(b) { bpm = b; },
    track(n) { T = TRACKS[n] || TRACKS[0]; step = 0; },
    get on() { return playing; }
  };

  function setMuted(m) {
    muted = m;
    try { localStorage.setItem('cook.muted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.5, ctx.currentTime, 0.02);
  }
  return {
    init, sfx, music,
    get muted() { return muted; },
    toggleMute() { setMuted(!muted); return muted; },
    get ready() { return !!ctx; },
    get state() { return ctx ? ctx.state : 'нет'; }
  };
})();
/* =====================================================================
   ДЕКОРАЦИИ: кухня в пикселях + рамка старого телевизора
   ===================================================================== */
function pxLine(c, x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  c.fillStyle = PAL[col] || col;
  for (;;) {
    c.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function pxDisc(c, cx, cy, r, col) {
  c.fillStyle = PAL[col] || col;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) c.fillRect(cx + x, cy + y, 1, 1);
}

const WINDOW_PANES = [[17, 25, 14, 17], [33, 25, 14, 17], [17, 45, 14, 17], [33, 45, 14, 17]];

  R('k', 41, 95, 20, 5); R('f', 42, 96, 18, 3); R('k', 49, 92, 4, 3); R('s', 50, 93, 2, 1);

// Анимированные детали кухни: облака, стрелки часов, пар
function drawScene(c, t) {
  c.drawImage(BG, 0, 0);
  // облака в окне
  c.save();
  c.beginPath(); for (const p of WINDOW_PANES) c.rect(p[0], p[1], p[2], p[3]); c.clip();
  c.fillStyle = PAL.w;
  const cx = 8 + ((t * 2.5) % 56), cx2 = 50 - ((t * 1.6) % 56);
  c.fillRect(cx + 2, 28, 6, 2); c.fillRect(cx, 30, 12, 3); c.fillRect(cx + 4, 26, 4, 2);
  c.fillRect(cx2 + 1, 50, 5, 2); c.fillRect(cx2, 52, 9, 2);
  c.restore();
  // часы — показывают настоящее время
  const d = new Date(), mn = d.getMinutes() + d.getSeconds() / 60, hr = (d.getHours() % 12) + mn / 60;
  const am = mn / 60 * Math.PI * 2, ah = hr / 12 * Math.PI * 2;
  pxLine(c, 240, 31, 240 + Math.sin(ah) * 4, 31 - Math.cos(ah) * 4, 'k');
  pxLine(c, 240, 31, 240 + Math.sin(am) * 7, 31 - Math.cos(am) * 7, 'k');
  c.fillStyle = PAL.R; c.fillRect(240, 31, 1, 1);
  // пар над кастрюлями
  c.fillStyle = PAL.w;
  for (const [px, py, ph] of [[22, 84, 0], [27, 84, 0.5], [50, 92, 0.25], [55, 92, 0.75]]) {
    const p = ((t * 0.5) + ph) % 1;
    c.globalAlpha = 0.8 * (1 - p);
    const s = p < 0.5 ? 2 : 3;
    c.fillRect(px + Math.round(Math.sin(p * 7 + ph * 9) * 3), py - Math.round(p * 24), s, s);
  }
  c.globalAlpha = 1;
}

/* ---------- Рамка телевизора, скан-линии, виньетка, блик ---------- */
function rrPath(c, x, y, w, h, r) {
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r); c.closePath();
}
function buildTvOverlay() {
  const c = mkCanvas(CW, CH), x = c.getContext('2d');

  x.beginPath(); rrPath(x, 0, 0, CW, CH, 46); rrPath(x, SX, SY, SW, SH, 24);
  const g = x.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#2d2b3b'); g.addColorStop(0.5, '#1b1926'); g.addColorStop(1, '#0d0c14');
  x.fillStyle = g; x.fill('evenodd');
  // блик на кромке корпуса
  x.beginPath(); rrPath(x, 1.5, 1.5, CW - 3, CH - 3, 45);
  const hg = x.createLinearGradient(0, 0, CW, CH);
  hg.addColorStop(0, 'rgba(255,255,255,.24)'); hg.addColorStop(0.5, 'rgba(255,255,255,.04)'); hg.addColorStop(1, 'rgba(0,0,0,.4)');
  x.strokeStyle = hg; x.lineWidth = 3; x.stroke();

  x.beginPath(); rrPath(x, SX - 6, SY - 6, SW + 12, SH + 12, 30); x.strokeStyle = 'rgba(255,255,255,.07)'; x.lineWidth = 2; x.stroke();
  // ручки, светодиод, надпись на нижней рамке

    x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 1; x.stroke();

  x.fillStyle = lg; x.fillRect(838, 572, 28, 28);
  x.fillStyle = '#ff6a58'; x.beginPath(); x.arc(852, 586, 3.2, 0, Math.PI * 2); x.fill();
  x.imageSmoothingEnabled = false;
  drawText(x, 'ВЕСЁЛЫЙ ПОВАР', 50, 579, '#6c6a88', 2);
  // эффекты «стекла» — только внутри экрана
  x.save(); x.beginPath(); rrPath(x, SX, SY, SW, SH, 24); x.clip();
  x.fillStyle = 'rgba(0,0,0,0.17)';                      // лёгкие скан-линии: тёмная полоска в каждой третьей строке
  for (let y = SY + 2; y < SY + SH; y += 3) x.fillRect(SX, y, SW, 1);
  const vg = x.createRadialGradient(CW / 2, CH / 2, 200, CW / 2, CH / 2, 560);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  x.fillStyle = vg; x.fillRect(SX, SY, SW, SH);          // виньетка
  const gg = x.createRadialGradient(SX + 180, SY + 90, 10, SX + 180, SY + 90, 320);
  gg.addColorStop(0, 'rgba(255,255,255,.08)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gg; x.fillRect(SX, SY, SW, SH);          // блик
  x.restore();

}

/* ------------------------------ Сложность ------------------------------ */
const LV_T = [2.4, 2.4, 2.2, 2.4, 2.2, 2.0, 2.2, 2.0, 1.8, 2.0];   // время полёта еды
function levelParams(L) {
  if (G.state === 'title') return { n: 2, T: 1.9, frac: 0.45, Hmin: 70, Hmax: 100 };   // демо на заставке
  const i = Math.min(L, 10) - 1;
  return {
    n: G.dishes,                                    // сколько блюд в воздухе: +1 за каждые 100 очков
    T: L <= 10 ? LV_T[i] : Math.max(1.75, 2.0 - 0.03 * (L - 10)),
    frac: Math.min(0.85, 0.34 + 0.045 * (L - 1)),   // какую долю скорости повара требует расписание
    Hmin: 92, Hmax: 128
  };
}
function catchesPerLevel(L) { return 8 + 2 * L; }

/* ------------------------------ Еда ------------------------------ */
// Подбираем точку и время приземления так, чтобы повар успевал добежать
// до каждого куска (никаких «невозможных» ситуаций), но не слишком легко.
function planToss(x0, self, lp) {
  const now = G.time, vmax = COOK_SPEED * lp.frac;
  const others = G.foods.filter(f => f !== self && f.state === 'air' && !f.missed).map(f => ({ t: f.landAt, x: f.landX }));
  let best = null, bestScore = Infinity;
  for (let i = 0; i < 80; i++) {
    const T = lp.T * rnd(0.86, 1.14);
    const [lo, hi] = waiterFree(now + T, 24, 256);             // пока официант на кухне, часть пола занята
    const okRange = lo <= hi, a = okRange ? lo : 24, b = okRange ? hi : 256;
    const xt = i < 40 ? rnd(a, b) : clamp(x0 + rnd(-70, 70), a, b);
    const evs = [{ t: now, x: x0 }].concat(others, [{ t: now + T, x: xt }]).sort((a, b) => a.t - b.t);
    let worst = 0, crowded = false, blocked = 0;
    for (let j = 1; j < evs.length; j++) {
      const gap = evs[j].t - evs[j - 1].t, d = Math.abs(evs[j].x - evs[j - 1].x);
      if (gap < MIN_GAP && d > 12) crowded = true;
      worst = Math.max(worst, d / Math.max(gap, 0.05));
      if (G.waiters.length && !pathClear(G.waiters, evs[j - 1].t, evs[j - 1].x, evs[j].t, evs[j].x)) blocked++;   // на пути стоит официант
    }
    const score = worst + (crowded ? 1000 : 0) + blocked * 500 + (okRange ? 0 : 800);
    if (score <= vmax) return { T, x: xt, H: rnd(lp.Hmin, lp.Hmax) };
    if (score < bestScore) { bestScore = score; best = { T, x: xt, H: rnd(lp.Hmin, lp.Hmax) }; }
  }
  return best;
}
function launch(f, x0) {
  const p = planToss(x0, f, levelParams(G.level));
  f.x0 = x0; f.y0 = CATCH_Y; f.T = p.T; f.vx = (p.x - x0) / p.T;
  f.g = 8 * p.H / (p.T * p.T); f.v0 = 4 * p.H / p.T;      // парабола: вершина H, приземление ровно через T
  f.t = 0; f.x = x0; f.y = CATCH_Y; f.state = 'air'; f.missed = false;
  f.landX = p.x; f.landAt = G.time + p.T;
  f.spinDir = Math.random() < 0.5 ? 1 : -1;
}
function dropFood(f) {                     // новое блюдо падает сверху вертикально в заранее выбранную точку
  const p = planToss(cook.x, f, Object.assign({}, levelParams(G.level), { T: DROP_T }));
  f.x0 = p.x; f.y0 = DROP_Y; f.vx = 0; f.v0 = 0; f.T = p.T;
  f.g = 2 * (CATCH_Y - DROP_Y) / (p.T * p.T);            // свободное падение: до высоты сковородки ровно за T
  f.t = 0; f.x = p.x; f.y = DROP_Y; f.state = 'air'; f.missed = false; f.fresh = true;
  f.landX = p.x; f.landAt = G.time + p.T;
  f.spinDir = Math.random() < 0.5 ? 1 : -1;
}
function spawnFood() {
  const f = { type: rndi(0, SPR.foods.length - 1), x: cook.x, y: DROP_Y, x0: cook.x, y0: DROP_Y, vx: 0, v0: 0, g: 0, T: 1, t: 0, landX: cook.x, landAt: 0, state: 'air', missed: false, fresh: true, rot: 0, spinDir: 1 };
  G.foods.push(f);
  dropFood(f);
  Sound.sfx.fall();
}
function onCatch(f) {
  const perfect = Math.abs(f.x - cook.x) <= 3;
  f.fresh = false;
  cook.flick = 0.16;
  sparkle(f.x, CATCH_Y + 2, perfect);
  if (G.state === 'play') {
    G.combo++; G.catches++;
    const mult = Math.min(5, 1 + Math.floor(G.combo / 10));
    const pts = (SPR.foods[f.type].pts + (perfect ? 5 : 0)) * mult;
    addScore(pts);
    pop(f.x, CATCH_Y - 10, '+' + pts, perfect ? 'y' : 'w');
    Sound.sfx.catch(perfect, G.combo);
    if (G.combo % 10 === 0) toast('КОМБО ×' + mult + '!');
    if (G.catches >= G.nextLevelAt) levelUp();
  }
  launch(f, f.x);
}
function onFloor(f) {
  f.state = 'floor'; f.y = FOOD_FLOOR; f.rot = 0;
  dust(f.x, FOOD_FLOOR + 4);
  if (G.state !== 'play' || G.noPenalty) return;
  G.lives--; G.combo = 0;
  if (!REDUCE_MOTION) G.shake = 0.3;
  G.spawnCd = Math.max(G.spawnCd, 1.1);
  pop(f.x, FOOD_FLOOR - 14, 'ОЙ!', 'R');
  Sound.sfx.drop();
  if (G.lives <= 0) gameOver();
}
function addScore(pts) {
  G.score += pts;
  if (G.score > G.hi) { G.hi = G.score; G.newRecord = true; }
  while (G.score >= G.nextOrder) {         // каждые 100 очков — заказ: за ним выбежит официант (см. updateWaiters)
    G.nextOrder += ORDER_STEP;
    G.orders = Math.min(ORDER_QUEUE, G.orders + 1);
  }
  while (G.score >= G.nextLife) {          // каждые 1000 очков — дополнительная жизнь (не больше пяти)
    G.nextLife += 1000;
    if (G.lives < 5) { G.lives++; toast('+1 ЖИЗНЬ!'); Sound.sfx.life(); }
  }
}

/* ------------------------------ Эффекты ------------------------------ */
function sparkle(x, y, perfect) {

  for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: rnd(-45, 45), vy: rnd(-95, -25), life: rnd(0.25, 0.5), col: perfect ? (Math.random() < 0.5 ? 'y' : 'w') : (Math.random() < 0.5 ? 'w' : 'l'), s: Math.random() < 0.3 ? 2 : 1 });
}
function dust(x, y) { for (let i = 0; i < 8; i++) G.parts.push({ x, y, vx: rnd(-55, 55), vy: rnd(-45, -8), life: rnd(0.25, 0.5), col: Math.random() < 0.5 ? 'l' : 'f', s: 2 }); }
function confetti() {
  const cols = ['R', 'y', 'G', 'B', 'P', 'o'];
  for (let i = 0; i < 26; i++) G.parts.push({ x: rnd(20, 260), y: rnd(14, 26), vx: rnd(-25, 25), vy: rnd(5, 45), life: rnd(0.9, 1.5), col: cols[rndi(0, cols.length - 1)], s: 2 });
}
function pop(x, y, text, col) { G.pops.push({ x, y, text, col, life: 0.9 }); }

/* ------------------------------ Управление ------------------------------ */
const down = new Set();
let lastH = 0;
function inputDir() {
  const l = down.has('ArrowLeft') || down.has('KeyA'), r = down.has('ArrowRight') || down.has('KeyD');
  if (l && r) return lastH;
  return r ? 1 : l ? -1 : 0;
}
const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'PageUp', 'PageDown', 'Home', 'End']);
function codeOf(e) {
  if (e.code) return e.code;
  return ({ ArrowLeft: 'ArrowLeft', Left: 'ArrowLeft', ArrowRight: 'ArrowRight', Right: 'ArrowRight', ArrowUp: 'ArrowUp', Up: 'ArrowUp',
    ArrowDown: 'ArrowDown', Down: 'ArrowDown', ' ': 'Space', Enter: 'Enter', Escape: 'Escape', p: 'KeyP', P: 'KeyP', m: 'KeyM', M: 'KeyM', a: 'KeyA', A: 'KeyA', d: 'KeyD', D: 'KeyD' })[e.key] || e.key;
}
function press(code) {                 // нажатие: клавишей или кнопкой на экране
  down.add(code);
  if (code === 'ArrowLeft' || code === 'KeyA') lastH = -1;
  if (code === 'ArrowRight' || code === 'KeyD') lastH = 1;
  onPress(code);
}
function release(code) { down.delete(code); }
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const code = codeOf(e);
  if (PREVENT.has(code)) e.preventDefault();      // стрелки и пробел не должны прокручивать страницу
  if (e.repeat) return;
  Sound.init();                                    // звук можно включать только после действия пользователя
  if (code.startsWith('Arrow') || code.startsWith('Key') || code === 'Space') setTouchMode(false);   // играют с клавиатуры — кнопки на экране не нужны
  press(code);
}, { passive: false });
window.addEventListener('keyup', e => {
  const code = codeOf(e);
  if (PREVENT.has(code)) e.preventDefault();
  release(code);
});
window.addEventListener('blur', () => { down.clear(); releaseTouch(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { down.clear(); releaseTouch(); pauseGame(); } });

function onPress(code) {
  if (code === 'KeyM') {
    const m = Sound.toggleMute();
    drawSoundIcon();
    toast(m ? 'ЗВУК: ВЫКЛ' : 'ЗВУК: ВКЛ', G.state === 'paused' ? 150 : G.state === 'play' || G.state === 'harvest' ? 56 : 150);   // на паузе — под строками с текстом
    if (!m) Sound.sfx.blip();
    return;
  }
  const go = code === 'Space' || code === 'Enter', pz = code === 'KeyP' || code === 'Escape';
  if (G.state === 'title') { if (go) startGame(); }
  else if (G.state === 'over') { if (go && G.overT <= 0) startGame(); }
  else if (G.state === 'play') { if (pz) pauseGame(); }
  else if (G.state === 'harvest') { if (pz) pauseGame(); else harvestPress(code); }
  else if (G.state === 'paused') { if (pz || go) resumeGame(); }
}

/* ------------------------------ Кнопки на экране (телефон) ------------------------------ */
// В телефоне нет клавиатуры, поэтому вокруг экрана появляются кнопки. Они нажимают те же press/release,
// что и клавиши, и правила игры остаются теми же. Слева — ход (можно вести пальцем), справа — прыжок и удар
// (нужны только на огороде), сверху — пауза, звук и «на весь экран».
let touchMode = false;
const padEl = document.getElementById('pad'), dpadEl = document.getElementById('dpad'), hintEl = document.getElementById('hint');
const insetEl = document.getElementById('inset');
const bHit = document.getElementById('bHit'), bJump = document.getElementById('bJump');
const bPause = document.getElementById('bPause'), bSound = document.getElementById('bSound'), bFull = document.getElementById('bFull');
const releasers = [];
function releaseTouch() { for (const f of releasers) f(); }
function setTouchMode(on) {
  if (on === touchMode) return;
  touchMode = on;
  document.body.classList.toggle('touch', on);
  if (!on) releaseTouch();
  fit();
}

const POINTER_END = ['pointerup', 'pointercancel', 'lostpointercapture'];
function holdButton(el, code) {            // пока палец на кнопке, «клавиша» зажата
  let id = null;
  const end = e => {
    if (id === null || (e && e.pointerId !== id)) return;
    id = null; el.classList.remove('on'); release(code);
  };
  el.addEventListener('pointerdown', e => {
    if (id !== null) return;
    e.preventDefault(); id = e.pointerId;
    try { el.setPointerCapture(id); } catch (err) { /* без захвата кнопка отпустится по pointerup */ }
    el.classList.add('on'); press(code);
  });
  for (const t of POINTER_END) el.addEventListener(t, end);
  releasers.push(() => end());
}
function bindDpad() {                      // одна широкая кнопка: сторону выбирает положение пальца, им можно вести
  let id = null, cur = null;
  const set = code => {
    if (code === cur) return;
    if (cur) release(cur);
    cur = code;
    dpadEl.classList.toggle('l', code === 'ArrowLeft'); dpadEl.classList.toggle('r', code === 'ArrowRight');
    if (code) press(code);
  };
  const side = e => { const r = dpadEl.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? 'ArrowLeft' : 'ArrowRight'; };
  const end = e => { if (id === null || (e && e.pointerId !== id)) return; id = null; set(null); };
  dpadEl.addEventListener('pointerdown', e => {
    if (id !== null) return;
    e.preventDefault(); id = e.pointerId;
    try { dpadEl.setPointerCapture(id); } catch (err) { /* см. holdButton */ }
    set(side(e));
  });
  dpadEl.addEventListener('pointermove', e => { if (e.pointerId === id) set(side(e)); });
  for (const t of POINTER_END) dpadEl.addEventListener(t, end);
  releasers.push(() => end());
}

function tapButton(el, fn) {               // касание: срабатывает, когда палец отпущен на кнопке
  let id = null;                           // (событие click не приходит, если другой палец уже держит кнопку хода)
  const clear = () => { id = null; el.classList.remove('on'); };
  el.addEventListener('pointerdown', e => { if (id === null) { id = e.pointerId; el.classList.add('on'); } });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return;
    clear();
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) fn();
  });
  el.addEventListener('pointercancel', clear);
  releasers.push(clear);
}

const ICON = {                             // значки кнопок, по пикселям
  L: ['....#', '...##', '..###', '.####', '#####', '.####', '..###', '...##', '....#'],
  R: ['#....', '##...', '###..', '####.', '#####', '####.', '###..', '##...', '#....'],
  U: ['....#....', '...###...', '..#####..', '.#######.', '#########'],
  pause: Array(9).fill('###..###'),
  snd: ['...#.....', '..##..#..', '####...#.', '####...#.', '####...#.', '..##..#..', '...#.....'],
  mute: ['...#.....', '..##.....', '####.#.#.', '####..#..', '####.#.#.', '..##.....', '...#.....'],
  full: ['###...###', '#.......#', '#.......#', '.........', '.........', '.........', '#.......#', '#.......#', '###...###']
};
function paintIcon(el, rows, col, k) {     // значок с тенью в один пиксель, растянутый в k раз
  const cv = el.querySelector('canvas'), w = rows[0].length, h = rows.length;
  cv.width = w + 1; cv.height = h + 1;
  const c = cv.getContext('2d');
  for (const [d, color] of [[1, PAL.k], [0, PAL[col]]]) {
    c.fillStyle = color;
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) if (r[x] === '#') c.fillRect(x + d, y + d, 1, 1); });
  }
  cv.style.width = (w + 1) * k + 'px'; cv.style.height = (h + 1) * k + 'px';
}
function paintText(el, str, col, k) {
  const cv = el.querySelector('canvas');
  cv.width = textWidth(str, 1) + 2; cv.height = 9;
  drawTextO(cv.getContext('2d'), str, 1, 1, col, 1);
  cv.style.width = cv.width * k + 'px'; cv.style.height = cv.height * k + 'px';
}
function drawSoundIcon() { paintIcon(bSound, Sound.muted ? ICON.mute : ICON.snd, 'w', 2); }
let paintedB = 0;
function paintPad(b) {
  if (b === paintedB) return;
  paintedB = b;
  const k = Math.max(1, Math.floor(b / 20));
  paintIcon(dpadEl.children[0], ICON.L, 'y', k); paintIcon(dpadEl.children[1], ICON.R, 'y', k);
  paintIcon(bJump, ICON.U, 'w', k);
  paintText(bHit, 'УДАР', 'w', Math.max(1, Math.floor(b * 0.72 / 25 * 2) / 2));
  paintIcon(bPause, ICON.pause, 'w', 2); paintIcon(bFull, ICON.full, 'w', 2);
  drawSoundIcon();
}

function place(el, x, y, w, h) {
  el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px';
  el.style.width = Math.round(w) + 'px'; el.style.height = Math.round(h) + 'px';
}
function safeInsets() {                    // вырезы и скруглённые углы экрана телефона
  const cs = getComputedStyle(insetEl), px = v => parseFloat(v) || 0;
  return { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) };
}
function fitTouch() {
  const W = window.innerWidth, H = window.innerHeight, ins = safeInsets();
  const L = ins.l, T = ins.t, aw = W - ins.l - ins.r, ah = H - ins.t - ins.b;
  const M = 8, GAP = 6, MINI = 44;         // поля, зазор между кнопками, размер маленьких кнопок
  // Вариант «по бокам»: экран посередине, кнопки слева и справа (телефон лёжа).
  const shA = (ah - 8) / CH;
  const bA = clamp(Math.floor(((aw - CW * shA) / 2 - 2 * M - GAP) / 2), 46, 76);
  const sA = Math.max(0.25, Math.min(shA, (aw - 2 * (2 * bA + GAP + 2 * M)) / CW));
  // Вариант «под экраном»: экран сверху на всю ширину, кнопки внизу (телефон стоя, планшет).
  const bB = clamp(Math.floor((aw / 2 - 2 * M - GAP) / 2), 46, aw >= 700 ? 96 : 84);
  const byB = T + ah - M - bB, myB = byB - GAP - MINI, roomB = myB - GAP - T;
  const sB = Math.max(0.25, Math.min((aw - 8) / CW, (roomB - 40) / CH));
  const side = sA > sB * 1.15;             // боковые кнопки берём, только если экран заметно крупнее
  let s, b, cx, cy, by, my;
  if (side) {
    s = sA; b = bA;
    cx = L + (aw - CW * s) / 2; cy = T + (ah - CH * s) / 2;
    by = T + ah - M - b; my = T + M;
  } else {
    s = sB; b = bB; by = byB; my = myB;
    cx = L + (aw - CW * s) / 2; cy = T + Math.max(6, (roomB - CH * s) * 0.4);
  }
  const rotate = !side && aw < 560;        // телефон стоя: подсказываем повернуть его
  document.body.classList.toggle('rotate', rotate);
  document.body.style.height = H + 'px';
  padEl.style.width = W + 'px'; padEl.style.height = H + 'px';
  tv.style.width = Math.round(CW * s) + 'px'; tv.style.height = Math.round(CH * s) + 'px';
  tv.style.left = Math.round(cx) + 'px'; tv.style.top = Math.round(cy) + 'px'; tv.style.borderRadius = Math.round(46 * s) + 'px';
  const wide = 2 * b + GAP, xl = L + M, xr = L + aw - M - wide;
  place(dpadEl, xl, by, wide, b);
  place(bHit, xr, by, b, b); place(bJump, xr + b + GAP, by, b, b);
  place(bPause, xl, my, MINI, MINI);
  let mx = L + aw - M - MINI;
  place(bSound, mx, my, MINI, MINI); mx -= MINI + GAP;
  if (!bFull.hidden) place(bFull, mx, my, MINI, MINI);

/* ------------------------------ Официанты ------------------------------ */
// Официант выходит из-за края кухни, идёт вглубь, стоит с подносом («заказ!») и уходит обратно.
// Его путь известен заранее, поэтому расписание полёта еды заранее обходит этот путь:
// столкнуться с официантом можно только по собственной невнимательности.
function waiterLife(w) { return 2 * w.dIn / w.v + w.S; }
function waiterX(w, tau) {                 // положение по «личному» времени официанта (до выхода tau < 0)
  const tIn = w.dIn / w.v;
  if (tau <= 0 || tau >= 2 * tIn + w.S) return w.xEdge;
  if (tau < tIn) return w.xEdge + w.inward * w.v * tau;
  if (tau < tIn + w.S) return w.xEdge + w.inward * w.dIn;
  return w.xEdge + w.inward * (w.dIn - w.v * (tau - tIn - w.S));
}
function waiterAt(w, t) {                  // где официант будет в момент t (null — его там ещё нет или уже нет)
  const tau = w.tau + (t - G.time);
  return tau <= 0 || tau >= waiterLife(w) ? null : waiterX(w, tau);
}
function waiterStop(w) { return w.xEdge + w.inward * w.dIn; }
// Сужает участок пола [lo, hi] до свободного в момент t: пока официант на кухне, у его края пола еда не приземляется
function waiterFree(t, lo, hi) {
  for (const w of G.waiters) {
    const tau = w.tau + (t - G.time);
    if (tau > -0.3 && tau < waiterLife(w) + 0.3) {
      const xs = waiterStop(w);
      if (w.side < 0) lo = Math.max(lo, xs + ZONE_M); else hi = Math.min(hi, xs - ZONE_M);
    }
  }
  return [lo, hi];
}
function pathClear(ws, t0, x0, t1, x1) {   // можно ли пройти из (t0, x0) в (t1, x1), не задев официантов
  const n = Math.max(1, Math.ceil((t1 - t0) / 0.08));
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n, x = x0 + (x1 - x0) * i / n;
    for (const w of ws) { const xw = waiterAt(w, t); if (xw !== null && Math.abs(x - xw) < SAFE_DIST) return false; }
  }
  return true;
}
function trySpawnWaiter() {
  const ws = G.waiters, L = G.level;
  const evs = G.foods.filter(f => f.state === 'air' && !f.missed).map(f => ({ t: f.landAt, x: f.landX })).sort((a, b) => a.t - b.t);
  const chain = [{ t: G.time, x: cook.x }].concat(evs);
  for (let i = 0; i < 30; i++) {
    const side = ws.length ? -ws[0].side : (Math.random() < 0.5 ? -1 : 1);      // -1: слева, 1: справа; второй — с другой стороны
    let dmax = L >= 8 ? 140 : L >= 5 ? 125 : 105;                              // насколько глубоко зайдёт
    if (ws.length) dmax = Math.min(dmax, 134 - (ws[0].dIn - 14));               // между двумя официантами остаётся проход
    if (dmax < 50) return false;
    const depth = rnd(50, dmax);
    const w = { side, xEdge: side < 0 ? -14 : 294, inward: -side, dIn: depth + 14, v: rnd(46, 58) + Math.min(12, L),
      S: rnd(1.3, 2.4), tau: -WARN_T, pause: 0, x: side < 0 ? -14 : 294, dir: -side, anim: 0, mode: 'warn' };
    let ok = true;                                                             // уже запланированные приземления не должны пересекаться с ним
    const xs = waiterStop(w), life = waiterLife(w);
    for (let j = 1; j < chain.length && ok; j++) {
      const tau = -WARN_T + (chain[j].t - G.time);                             // «личное» время официанта в момент приземления
      if (tau > -0.3 && tau < life + 0.3 && (side < 0 ? chain[j].x < xs + ZONE_M : chain[j].x > xs - ZONE_M)) ok = false;
    }
    for (let j = 1; j < chain.length && ok; j++) ok = pathClear([w], chain[j - 1].t, chain[j - 1].x, chain[j].t, chain[j].x);
    if (!ok) continue;
    ws.push(w);
    Sound.sfx.bell();
    return true;
  }
  return false;
}
function bumpCook(w) {                     // официант врезался в повара
  cook.kdir = cook.x < w.x ? -1 : cook.x > w.x ? 1 : w.inward;
  cook.knockT = 0.22; cook.stun = 0.9; cook.iframes = 1.7;
  w.pause = 0.6;
  G.combo = 0;
  if (!REDUCE_MOTION) G.shake = Math.max(G.shake, 0.22);
  pop(cook.x, CATCH_Y - 24, 'БАМ!', 'R');
  const cols = ['w', 'l', 'f', 'y'];       // осколки посуды с подноса
  for (let i = 0; i < 12; i++) G.parts.push({ x: w.x + w.inward * 8, y: 132, vx: rnd(-70, 70), vy: rnd(-120, -30), life: rnd(0.4, 0.9), col: cols[rndi(0, 3)], s: 2 });
  Sound.sfx.bump();
}
function dispatchOrder(w) {                // официант вышел с заказом; блюдо появится, когда он дойдёт и скажет «заказ»
  G.orders--;
  G.waiterCd = 3;                          // следующий заказ не раньше чем через несколько секунд
  w.order = true;
}
function giveBackOrder(w) {                // официант ушёл, не сказав заказ (например, повар отправился на огород): заказ не пропадает
  if (w.order) { w.order = false; G.orders = Math.min(ORDER_QUEUE, G.orders + 1); }
}
function deliverOrder(w) {                 // официант дошёл и сказал «заказ»: сверху падает новое блюдо
  w.order = false;
  if (G.waiters.some(x => x !== w && x.pickup && !x.took)) { G.orders = Math.min(ORDER_QUEUE, G.orders + 1); return; }   // другой официант как раз забирает блюда: заказ подождёт
  const added = G.dishes < DISH_MAX;
  if (added) { G.dishes++; G.spawnCd = Math.min(G.spawnCd, 0.15); }
  toast(added ? 'ЗАКАЗ! +1 БЛЮДО' : 'ЗАКАЗ!');
  if (G.dishes >= DISH_MAX) { w.pickup = true; cook.shoutT = 2; Sound.sfx.shout(); }   // четыре блюда: повар зовёт официанта забрать заказ
}
function takeDishes(w) {                   // официант дошёл и забирает блюда прямо из воздуха: они летят к нему на поднос
  w.took = true;
  const air = G.foods.filter(f => f.state === 'air' && !f.missed)     // сперва те, что уже ловили, и ближайшие к официанту
    .sort((a, b) => (!!a.fresh - !!b.fresh) || (Math.abs(a.x - w.x) - Math.abs(b.x - w.x))).slice(0, DISH_TAKE);
  for (const f of air) { f.state = 'taken'; f.takeT = 0; f.fx = f.x; f.fy = f.y; f.who = w; }
  G.dishes = Math.max(1, G.dishes - DISH_TAKE);
  toast('ЗАБРАЛИ ' + DISH_TAKE + ' БЛЮДА!');
  Sound.sfx.pick();
}
function updateWaiters(dt) {
  if (G.state === 'play' && G.readyT <= 0 && !G.noPenalty) {
    if (G.waiterCd > 0) G.waiterCd -= dt;
    if (G.orders > 0 && G.waiterCd <= 0 && !G.waiters.some(w => w.pickup && !w.took)) {
      if (G.waiters.length < (G.level >= 7 ? 2 : 1) && trySpawnWaiter()) dispatchOrder(G.waiters[G.waiters.length - 1]);
      else G.waiterCd = 0.5;                                                   // сейчас безопасного пути нет — попробуем чуть позже
    }
  }
  for (const w of G.waiters) {
    w.anim += dt;
    if (w.pause > 0) w.pause -= dt; else w.tau += dt;
    const tIn = w.dIn / w.v;
    if (w.order && w.tau >= tIn && G.state === 'play' && !G.noPenalty) deliverOrder(w);
    if (w.pickup && !w.took && w.tau >= tIn + 0.6 && G.state === 'play' && !G.noPenalty) takeDishes(w);   // через мгновение после крика
    w.x = waiterX(w, w.tau);
    w.dir = w.tau < tIn + w.S ? w.inward : -w.inward;
    w.mode = w.tau <= 0 ? 'warn' : w.pause > 0 ? 'stumble' : w.tau < tIn ? 'in' : w.tau < tIn + w.S ? 'stand' : 'out';
    if (G.state === 'play' && !G.noPenalty && w.tau > 0 && cook.iframes <= 0 && Math.abs(cook.x - w.x) < BUMP_DIST) bumpCook(w);
  }
  G.waiters = G.waiters.filter(w => { const stay = w.tau < waiterLife(w); if (!stay) giveBackOrder(w); return stay; });
}
// Автопилот для проверок: едет к ближайшему приземлению с постоянной скоростью — именно этот путь и проверяет расписание
function botCareful(dt) {
  let t = null;
  for (const f of G.foods) if (f.state === 'air' && !f.missed && (!t || f.landAt < t.landAt)) t = f;
  if (!t) return 0;
  const dist = clamp(t.landX, COOK_MIN, COOK_MAX) - cook.x, remain = t.landAt - G.time;
  const sp = Math.min(COOK_SPEED, remain > 0.03 ? Math.abs(dist) / remain : COOK_SPEED);
  const mv = clamp(dist, -sp * dt, sp * dt);
  cook.x += mv;
  return Math.abs(mv) > 0.02 ? Math.sign(mv) : 0;
}

/* ------------------------------ Огород: сбор урожая ------------------------------ */
// После каждых двух пройденных уровней повар выходит на огород собирать овощи.
// Ходит стрелками, прыгает (стрелка вверх), бьёт сковородкой (пробел). Камни надо перепрыгивать,
// на колорадских жуков — прыгать сверху или бить их сковородкой. Собрал 30 продуктов — вернулся на кухню.
// Серия из 10 продуктов подряд без столкновений даёт ×2. Столкновение сбрасывает серию и роняет часть урожая.
let HV = null;

function startFade(wait, onMid) { G.fade = { wait, a: 0, dir: 1, onMid }; }
function updateFade(dt) {                    // затемнение: пауза → чернеет → onMid → светлеет
  const F = G.fade;
  if (!F) return;
  if (F.wait > 0) { F.wait -= dt; return; }
  F.a += F.dir * dt / 0.5;
  if (F.dir > 0 && F.a >= 1) { F.a = 1; F.dir = -1; F.onMid(); }
  else if (F.dir < 0 && F.a <= 0) G.fade = null;
}
function drawFade(c) {
  if (G.fade && G.fade.a > 0) { c.globalAlpha = Math.min(1, G.fade.a); c.fillStyle = PAL.k; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }
}

function newHarvest() {
  return {
    phase: 'intro', t: 0, introT: 2.8, stage: Math.floor(G.level / 2), doneT: 0, bonus: 0, hint: 8,
    hp: { x: 46, z: 0, vz: 0, face: 1, off: PAN_DX, walkT: 0, moving: false, jumped: false, swingT: 0, swingCd: 0,
          iframes: 0, stun: 0, knockT: 0, kdir: 1, jumpBuf: 0 },
    items: [], rocks: [], bugs: [], count: 0, streak: 0, hits: 0, kills: 0, genX: 160, cam: 0
  };
}
function enterHarvest() {                    // вызывается посреди затемнения
  G.state = 'harvest'; G.noPenalty = false;
  HV = newHarvest();
  while (HV.genX < 560) genChunk();
  for (const w of G.waiters) giveBackOrder(w);
  G.foods = []; G.waiters = []; G.parts = []; G.pops = []; G.toast = null; G.shake = 0;
  Sound.music.track(1); Sound.music.tempo(122); Sound.sfx.harvest();
}
function leaveHarvest() {                    // вызывается посреди затемнения: повар появляется на кухне
  G.state = 'play'; G.noPenalty = false; HV = null;
  G.foods = []; G.waiters = []; G.parts = []; G.pops = [];
  cat.x = CAT_HOME; cat.state = 'idle'; cat.target = null; cat.dir = -1;
  cook.x = 140; cook.off = PAN_DX; cook.face = 1; cook.flick = 0; cook.stun = 0; cook.knockT = 0; cook.iframes = 0;
  G.readyT = 1.3; G.spawnCd = 0; G.waiterCd = Math.max(G.waiterCd, 4); cook.shoutT = 0;
  if (G.dishes >= DISH_MAX) G.orders = Math.max(G.orders, 1);   // перед огородом блюд было четыре: официант всё равно придёт за заказом
  Sound.music.track(0); Sound.music.tempo(Math.min(176, 132 + G.level * 4));
  sparkle(cook.x, CATCH_Y, true); sparkle(cook.x - 14, CATCH_Y + 6, true); sparkle(cook.x + 14, CATCH_Y + 6, true);

}
function harvestPress(code) {
  const hp = HV.hp;
  if (HV.phase === 'intro') { if (HV.t > 0.8) HV.introT = 0; return; }          // любая клавиша пропускает заставку
  if (HV.phase !== 'run') return;

  else if (code === 'Space' || code === 'KeyX' || code === 'KeyZ') {            // удар сковородкой
    if (hp.swingCd > 0 || hp.stun > 0) return;
    hp.swingT = 0.22; hp.swingCd = 0.38; Sound.sfx.swing();
  }
}

// Расстановка препятствий и продуктов кусками — впереди повара всегда есть новый участок огорода
function addItem(x, z, type) { HV.items.push({ x, z, type: type === undefined ? rndi(0, 3) : type, taken: false, drop: 0, vx: 0, vz: 0, ph: Math.random() * 6 }); }
function addRock(x, big) { HV.rocks.push({ x, w: big ? 14 : 10, h: big ? 11 : 8, v: big ? 0 : 1 }); }
function addBug(min, max) {
  const sp = 20 + 3 * Math.min(HV.stage, 6);
  HV.bugs.push({ x: (min + max) / 2 + rnd(-8, 8), min, max, dir: Math.random() < 0.5 ? -1 : 1, v: sp + rnd(-3, 3), state: 'walk', t: 0, anim: 0, vx: 0, vz: 0, z: 0 });
}
function genChunk() {
  const x0 = HV.genX, k = HV.stage;
  const bag = ['row', 'row', 'hop', 'hop', 'bug', 'bug'];
  if (k >= 2) bag.push('twin', 'bugrock', 'sky');
  if (k >= 3) bag.push('bugrock', 'twin');
  const t = bag[rndi(0, bag.length - 1)];
  let len = 120;
  const arc = (rx) => { for (let i = -2; i <= 2; i++) addItem(rx + i * 13, 26 + (2 - Math.abs(i)) * 9); };   // дуга над камнем
  if (t === 'row') {                         // ряд продуктов на земле
    const n = rndi(4, 6);
    for (let i = 0; i < n; i++) addItem(x0 + 24 + i * 15, 8);
    len = 48 + n * 15;
  } else if (t === 'hop') {                  // камень: перепрыгни и собери дугу
    const rx = x0 + 56; addRock(rx, Math.random() < 0.6); arc(rx);
    addItem(rx - 40, 8); addItem(rx + 40, 8);
    len = 116;
  } else if (t === 'twin') {                 // два камня, между ними — продукты на земле
    const r1 = x0 + 40, r2 = x0 + 125;
    addRock(r1, true); addRock(r2, Math.random() < 0.5);
    for (let i = 0; i < 3; i++) addItem((r1 + r2) / 2 - 14 + i * 14, 8);
    addItem(r1, 44); addItem(r2, 44);
    len = 175;
  } else if (t === 'bug') {                  // жук ходит туда-сюда: прыгни на него или ударь
    addBug(x0 + 40, x0 + 105);
    addItem(x0 + 62, 46); addItem(x0 + 84, 46);
    for (let i = 0; i < 3; i++) addItem(x0 + 130 + i * 15, 8);
    len = 185;
  } else if (t === 'bugrock') {              // камень и жук подряд
    const rx = x0 + 45; addRock(rx, true); arc(rx);
    addBug(x0 + 85, x0 + 140);
    for (let i = 0; i < 3; i++) addItem(x0 + 150 + i * 15, 8);
    len = 205;
  } else {                                   // 'sky': продукты высоко — только в прыжке
    for (let i = 0; i < 5; i++) addItem(x0 + 30 + i * 15, 48);
    for (let i = 0; i < 3; i++) addItem(x0 + 125 + i * 15, 8);
    len = 175;
  }
  HV.genX = x0 + len;
}

function collectItem(it) {
  if (HV.phase !== 'run') return;
  it.taken = true;
  HV.count++; HV.streak++;
  const mult = HV.streak >= COMBO_AT ? 2 : 1, pts = 10 * mult, sx = it.x - HV.cam, sy = GROUND_Y - it.z;
  addScore(pts);
  pop(sx, sy - 10, '+' + pts, mult > 1 ? 'y' : 'w');
  sparkle(sx, sy, mult > 1);
  Sound.sfx.pick(HV.streak);
  if (HV.streak === COMBO_AT) { toast('КОМБО ×2!'); Sound.sfx.life(); }
  if (HV.count >= HARVEST_GOAL) finishHarvest();
}
function harvestHit(srcX) {                  // задел камень или жука
  const hp = HV.hp;
  hp.iframes = 1.7; hp.stun = 0.5; hp.knockT = 0.25; hp.kdir = hp.x < srcX ? -1 : 1; hp.vz = 130; hp.z = Math.max(hp.z, 0.01); hp.jumped = false;
  HV.hits++; HV.streak = 0;
  const lost = Math.min(HV.count, 3);         // часть урожая рассыпается — её можно подобрать снова
  HV.count -= lost;
  for (let i = 0; i < lost; i++) HV.items.push({ x: hp.x, z: hp.z + 20, type: rndi(0, 3), taken: false, drop: 0.9, vx: rnd(-80, 80), vz: rnd(90, 170), ph: 0 });
  pop(hp.x - HV.cam, GROUND_Y - 46, lost ? '-' + lost : 'ОЙ!', 'R');
  if (!REDUCE_MOTION) G.shake = 0.2;
  Sound.sfx.bump();
}
function killBug(b, how) {
  b.state = how === 'pan' ? 'flip' : 'squash'; b.t = 0.6; HV.kills++;
  if (how === 'pan') { b.vx = HV.hp.face * 120; b.vz = 150; b.z = 1; } else b.z = 0;
  addScore(25);
  pop(b.x - HV.cam, GROUND_Y - 24, '+25', 'y');
  for (let i = 0; i < 8; i++) G.parts.push({ x: b.x - HV.cam, y: GROUND_Y - 6, vx: rnd(-60, 60), vy: rnd(-90, -20), life: rnd(0.3, 0.6), col: Math.random() < 0.5 ? 'y' : 'k', s: 2 });
  Sound.sfx.squash();
}
function finishHarvest() {
  HV.phase = 'done'; HV.doneT = 0; HV.bonus = HV.hits === 0 ? 100 : 0;
  if (HV.bonus) addScore(HV.bonus);
  confetti(); Sound.sfx.done();
  startFade(3.0, leaveHarvest);
}

function updateHarvest(dt) {
  const hp = HV.hp;
  HV.t += dt;
  if (HV.phase === 'intro') { HV.introT -= dt; if (HV.introT <= 0) HV.phase = 'run'; }
  const run = HV.phase === 'run';
  if (run && HV.hint > 0) HV.hint -= dt;

/* ------------------------------ Ход игры ------------------------------ */
function resetWorld() {

  cook.x = 140; cook.off = PAN_DX; cook.face = 1; cook.flick = 0; cook.walkT = 0;
  cook.stun = 0; cook.knockT = 0; cook.iframes = 0; cook.shoutT = 0; G.waiters = []; G.waiterCd = 0;
}
function startGame() {

  G.dishes = 1; G.orders = 0; G.nextOrder = ORDER_STEP; G.newRecord = false; G.readyT = 1.3; G.spawnCd = 0; G.shake = 0; G.toast = null; G.overT = 0;
  resetWorld();

}
function levelUp() {
  G.level++; G.nextLevelAt += catchesPerLevel(G.level);
  Sound.music.tempo(Math.min(176, 132 + G.level * 4));

  if ((G.level - 1) % 2 === 0) {            // пройдено два уровня — повар выходит на огород собирать урожай
    toast('УРОВЕНЬ ПРОЙДЕН!');
    G.noPenalty = true;                     // пока идёт переход, промахи и официанты ничего не отнимают
    startFade(1.3, enterHarvest);

}

  Sound.music.stop(); Sound.sfx.over(); saveHi(G.hi);
}

// Автопилот: ведёт повара под ближайшую по времени еду (демо на заставке и автотесты)
function botTarget() {
  let best = null;
  for (const f of G.foods) if (f.state === 'air' && !f.missed && (!best || f.landAt < best.landAt)) best = f;
  return best ? clamp(best.landX, COOK_MIN, COOK_MAX) : null;
}

function updateCook(dt) {
  let dir = 0;
  if (cook.iframes > 0) cook.iframes -= dt;
  if (cook.knockT > 0) { cook.x += cook.kdir * 190 * (cook.knockT / 0.22) * dt; cook.knockT -= dt; }
  if (cook.stun > 0) cook.stun -= dt;                       // оглушён — управлять нельзя
  else if (G.state === 'title') {                           // демо на заставке: быстрый автопилот
    const tx = botTarget();
    if (tx !== null) {
      const mv = clamp(tx - cook.x, -COOK_SPEED * dt, COOK_SPEED * dt);
      cook.x += mv;
      if (Math.abs(mv) > 0.05) dir = Math.sign(mv);
    }
  } else if (G.auto && G.state === 'play') dir = botCareful(dt);
  else if (G.state === 'play') { dir = inputDir(); cook.x += dir * COOK_SPEED * dt; }
  cook.x = clamp(cook.x, COOK_MIN, COOK_MAX);
  cook.moving = dir !== 0;
  if (dir !== 0) { cook.face = dir; cook.walkT += dt; } else cook.walkT = 0;
  cook.off += clamp(cook.face * PAN_DX - cook.off, -320 * dt, 320 * dt);
  if (cook.flick > 0) cook.flick = Math.max(0, cook.flick - dt);
  if (cook.shoutT > 0) cook.shoutT -= dt;
}

function updateSpawn(dt) {
  if (G.state !== 'play' && G.state !== 'title') return;
  if (G.readyT > 0) { G.readyT -= dt; return; }
  if (G.noPenalty) return;               // идёт переход на огород
  G.spawnCd -= dt;
  if (G.spawnCd <= 0 && G.foods.length < levelParams(G.level).n) { spawnFood(); G.spawnCd = 1.0; }
}

function updateFoods(dt) {
  for (const f of G.foods) {
    if (f.state === 'taken') {                          // летит на поднос официанта и исчезает
      f.takeT += dt / 0.45; f.rot += dt;
      const k = Math.min(1, f.takeT), e = k * k * (3 - 2 * k), w = f.who;
      f.x = f.fx + (w.x + 10 * w.dir - f.fx) * e; f.y = f.fy + (FLOOR_Y - 35 - f.fy) * e;
      if (k >= 1) { f.state = 'gone'; sparkle(f.x, f.y, false); }
      continue;
    }
    if (f.state !== 'air') continue;
    const t0 = f.t, t = (f.t += dt);
    f.x = f.x0 + f.vx * t;
    f.y = f.y0 - f.v0 * t + 0.5 * f.g * t * t;
    f.rot += dt;
    if (!f.missed && t > f.T * 0.5) {
      const yPrev = f.y0 - f.v0 * t0 + 0.5 * f.g * t0 * t0;
      if (yPrev < CATCH_Y && f.y >= CATCH_Y) {          // еда пересекла уровень сковородки сверху вниз
        if (G.state !== 'over' && G.state !== 'paused' && Math.abs(f.x - cook.x) <= CATCH_HALF) { onCatch(f); continue; }
        f.missed = true;
      }
    }
    if (f.missed && f.y >= FOOD_FLOOR) onFloor(f);
  }

function updateCat(dt) {
  cat.anim += dt;
  if (cat.state === 'eat') {
    cat.eatT -= dt; cat.chompT -= dt;
    if (cat.chompT <= 0) { Sound.sfx.chomp(); cat.chompT = 0.22; }
    if (cat.eatT <= 0.5 && cat.target) { cat.target.state = 'gone'; cat.target = null; }
    if (cat.eatT <= 0) cat.state = 'idle';
    return;
  }
  let tgt = null, bd = Infinity;
  for (const f of G.foods) if (f.state === 'floor') { const d = Math.abs(f.x - cat.x); if (d < bd) { bd = d; tgt = f; } }
  if (tgt) {
    if (cat.target !== tgt) { cat.target = tgt; if (G.state === 'play') Sound.sfx.meow(); }
    cat.dir = tgt.x < cat.x ? -1 : 1;
    const stopX = clamp(tgt.x - cat.dir * 12, 14, 266), step = 230 * dt, dx = stopX - cat.x;
    cat.state = 'run';
    if (Math.abs(dx) <= step) { cat.x = stopX; cat.state = 'eat'; cat.eatT = 0.9; cat.chompT = 0; }
    else cat.x += Math.sign(dx) * step;
  } else {
    cat.target = null;
    const dx = CAT_HOME - cat.x;
    if (Math.abs(dx) > 0.5) { cat.state = 'run'; cat.dir = dx < 0 ? -1 : 1; cat.x += Math.sign(dx) * Math.min(Math.abs(dx), 150 * dt); }
    else { cat.state = 'idle'; cat.x = CAT_HOME; }
  }
}

function updateFx(dt) {                     // частицы, всплывающие цифры, тосты, тряска
  for (const p of G.parts) { p.vy += 170 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 20 * dt; p.life -= dt; }
  G.pops = G.pops.filter(p => p.life > 0);
  if (G.toast) { G.toast.life -= dt; if (G.toast.life <= 0) G.toast = null; }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.overT > 0) G.overT -= dt;
}
function update(dt) {
  if (G.state === 'paused') {             // на паузе время игры стоит, гаснет только подсказка («ЗВУК: ВЫКЛ»)
    if (G.toast && (G.toast.life -= dt) <= 0) G.toast = null;
    return;
  }
  G.time += dt;
  updateFade(dt);
  if (G.state === 'harvest') { updateHarvest(dt); updateFx(dt); return; }
  updateCook(dt);
  updateWaiters(dt);
  updateSpawn(dt);
  updateFoods(dt);
  updateCat(dt);
  updateFx(dt);

}

}
function drawTextOC(c, str, cx, y, col, scale) { drawTextO(c, str, cx - textWidth(str, scale || 1) / 2, y, col, scale); }
function logoLine(c, str, cx, y, s, main, shadow) {      // крупная надпись с тенью и контуром
  const x = Math.round(cx - textWidth(str, s) / 2);
  for (let dy = -1; dy <= s + 1; dy++) for (let dx = -1; dx <= 1; dx++) drawText(c, str, x + dx, y + dy, 'k', s);
  drawText(c, str, x, y + s, shadow, s);
  drawText(c, str, x, y, main, s);
}
function drawKeycap(c, x, y, label) {
  const w = textWidth(label, 1) + 8;
  c.fillStyle = PAL.k; c.fillRect(x, y, w, 12);
  c.fillStyle = PAL.w; c.fillRect(x + 1, y + 1, w - 2, 8);
  c.fillStyle = PAL.f; c.fillRect(x + 1, y + 9, w - 2, 2);
  drawText(c, label, x + 4, y + 1, 'k');
  return w;
}
function dim(c, a) { c.globalAlpha = a; c.fillStyle = PAL.k; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }

function drawWaiters(c) {
  for (const w of G.waiters) {
    if (w.mode === 'warn') { drawWarnSign(c, w); continue; }
    const set = w.dir > 0 ? SPR.waiter : SPR.waiterL;
    const walking = w.mode === 'in' || w.mode === 'out';
    const shake = w.mode === 'stumble' ? (Math.floor(w.anim * 24) % 2 ? 1 : -1) : 0;
    c.drawImage(set[walking ? Math.floor(w.anim * 6) % 2 : 0], Math.round(w.x) - (w.dir > 0 ? 12 : 15) + shake, FLOOR_Y - 41);
    if (w.mode === 'stand') drawBubble(c, w.took ? 'ЗАБИРАЮ!' : 'ЗАКАЗ!', Math.round(w.x), FLOOR_Y - 56);
    else if (w.mode === 'stumble') drawBubble(c, 'ОЙ!', Math.round(w.x), FLOOR_Y - 56);
  }
}
function drawBubble(c, text, cx, y, tx) {    // облачко с репликой; tx — где хвостик (по умолчанию по центру)
  const w = textWidth(text, 1) + 6, x = cx - Math.floor(w / 2);
  tx = clamp(tx === undefined ? cx : tx, x + 3, x + w - 4);
  c.fillStyle = PAL.k; c.fillRect(x - 1, y - 1, w + 2, 11); c.fillRect(tx - 1, y + 10, 3, 2);
  c.fillStyle = PAL.w; c.fillRect(x, y, w, 9); c.fillRect(tx, y + 9, 1, 2);
  drawText(c, text, x + 3, y + 1, 'k');
}
function drawWarnSign(c, w) {                // мигающий знак у края: «сейчас зайдёт официант»
  if (Math.floor(G.time / 0.25) % 2) return;
  const x = w.side < 0 ? 3 : VW - 20, y = 140 + Math.round(Math.sin(G.time * 14));
  c.fillStyle = PAL.k; c.fillRect(x, y, 17, 13);
  c.fillStyle = PAL.y; c.fillRect(x + 1, y + 1, 15, 11);
  drawText(c, w.side < 0 ? '!→' : '←!', x + 5, y + 3, 'k');
}
function drawCookFig(c, o) {                 // o: bodyX, panX, face, wf, floor, shadowY, panDY, stun
  const bodyX = o.bodyX, panX = o.panX, face = o.face, floor = o.floor, top = floor - 40, wf = o.wf;
  c.globalAlpha = 0.28; c.fillStyle = PAL.k; c.fillRect(bodyX - 11, o.shadowY, 23, 2); c.fillRect(bodyX - 8, o.shadowY + 2, 17, 1); c.globalAlpha = 1;
  c.drawImage(SPR.legL, bodyX - 9, floor - 9 - (wf === 1 ? 2 : 0));
  c.drawImage(SPR.legR, bodyX + 1, floor - 9 - (wf === 3 ? 2 : 0));
  c.drawImage(SPR.cook, bodyX - 10, top);
  drawArm(c, bodyX - face * 8, top + 24, bodyX - face * 10, top + 31);                       // свободная рука
  const py = top + o.panDY;
  if (face > 0) c.drawImage(SPR.pan, panX - 20, py - 4); else c.drawImage(SPR.panL, panX - 13, py - 4);
  drawArm(c, bodyX + face * 8, top + 24, panX - face * 17, py);                              // рука со сковородкой
  if (o.stun) for (let i = 0; i < 3; i++) {                                                  // звёздочки над головой
    const a = G.time * 9 + i * 2.094, sx = Math.round(bodyX + Math.cos(a) * 9), sy = top - 4 + Math.round(Math.sin(a) * 3);
    c.fillStyle = PAL.k; c.fillRect(sx - 2, sy - 1, 5, 3); c.fillRect(sx - 1, sy - 2, 3, 5);
    c.fillStyle = PAL.y; c.fillRect(sx - 1, sy, 3, 1); c.fillRect(sx, sy - 1, 1, 3);
  }
  return py;
}
function drawCook(c) {
  const jit = cook.stun > 0 ? (Math.floor(G.time * 30) % 2 ? 1 : -1) : 0;       // трясётся, когда оглушён
  const lift = cook.flick > 0 ? -Math.round(4 * Math.sin((1 - cook.flick / 0.16) * Math.PI)) : 0;   // сковородка подпрыгивает при подбрасывании
  drawCookFig(c, {
    bodyX: Math.round(clamp(cook.x - cook.off, 11, 269)) + jit, panX: Math.round(cook.x) + jit, face: cook.face,
    wf: cook.moving ? Math.floor(cook.walkT / 0.1) % 4 : 0, floor: FLOOR_Y, shadowY: FLOOR_Y, panDY: 30 + lift, stun: cook.stun > 0
  });
}
function drawCookShout(c) {                  // повар зовёт официанта
  if (cook.shoutT <= 0) return;
  const bx = Math.round(clamp(cook.x - cook.off, 11, 269));
  drawBubble(c, 'ЗАБИРАЙ ЗАКАЗ!', clamp(bx, 48, 232), FLOOR_Y - 60, bx);
}
function drawArm(c, x0, y0, x1, y1) {
  const pts = [];
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) pts.push([Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n)]);
  c.fillStyle = PAL.k; for (const [x, y] of pts) c.fillRect(x - 2, y - 2, 5, 5);
  c.fillStyle = PAL.w; for (const [x, y] of pts) c.fillRect(x - 1, y - 1, 3, 3);
  c.fillStyle = PAL.k; c.fillRect(x1 - 2, y1 - 2, 5, 5);
  c.fillStyle = PAL.p; c.fillRect(x1 - 1, y1 - 1, 3, 3);
}
function drawFoods(c) {
  for (const f of G.foods) {                                // отметки приземления
    if (f.state !== 'air' || f.missed) continue;
    const a = clamp(1 - (f.landAt - G.time) / 1.1, 0, 1), x = Math.round(f.landX);
    c.globalAlpha = 0.15 + 0.4 * a; c.fillStyle = PAL.k;
    c.fillRect(x - 6, 173, 13, 1); c.fillRect(x - 4, 172, 9, 1); c.fillRect(x - 4, 174, 9, 1);
    c.globalAlpha = 1;
  }
  for (const f of G.foods) {
    const fr = SPR.foods[f.type].f;
    let k = 0;
    if (f.state === 'air' || f.state === 'taken') { const n = Math.floor(f.rot * 7); k = f.spinDir > 0 ? n % 4 : (3 - n % 4); }
    const s = fr[k];
    c.drawImage(s, Math.round(f.x - s.width / 2), Math.round(f.y - s.height / 2));
  }
}
function drawCat(c) {
  if (cat.state === 'idle') {
    c.drawImage(SPR.catSit, Math.round(cat.x) - 9, CAT_Y - 23);
    c.drawImage(SPR.catTail[Math.floor(G.time * 2) % 2], Math.round(cat.x) + 6, CAT_Y - 17);
    return;
  }
  const set = cat.state === 'run' ? (cat.dir < 0 ? SPR.catRun : SPR.catRunR) : (cat.dir < 0 ? SPR.catEat : SPR.catEatR);
  const s = set[Math.floor(cat.anim * (cat.state === 'run' ? 12 : 8)) % 2];
  c.drawImage(s, Math.round(cat.x) - 16, CAT_Y - 16);
}
function drawParticles(c) {
  for (const p of G.parts) { c.fillStyle = PAL[p.col]; c.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  for (const p of G.pops) drawTextOC(c, p.text, p.x, Math.round(p.y), p.col, 1);
}
function drawHud(c) {
  c.fillStyle = PAL.k; c.fillRect(0, 0, VW, HUD_H);
  c.fillStyle = PAL.n; c.fillRect(0, HUD_H - 1, VW, 1);
  if (G.state === 'title') { drawTextC(c, 'РЕКОРД ' + pad(G.hi, 6), 140, 2, 'y'); return; }
  drawText(c, 'ОЧКИ ' + pad(G.score, 6), 5, 2, 'y');
  const mult = Math.min(5, 1 + Math.floor(G.combo / 10));
  if (mult > 1) drawText(c, '×' + mult, 72, 2, 'R');
  drawText(c, 'РЕКОРД ' + pad(G.hi, 6), 94, 2, 'f');
  drawText(c, 'УР.' + G.level, 178, 2, 'w');
  for (let i = 0; i < Math.min(G.lives, 6); i++) c.drawImage(SPR.toque, VW - 4 - (i + 1) * 12, 1);
}
function blink(period) { return Math.floor(G.time / period) % 2 === 0; }

function drawTitle(c) {
  logoLine(c, 'ВЕСЁЛЫЙ', 140, 17, 3, 'y', 'r');
  logoLine(c, 'ПОВАР', 140, 42, 3, 'w', 'r');
  drawTextOC(c, 'ЛОВИ ЕДУ, БЕРЕГИСЬ ОФИЦИАНТОВ!', 140, 71, 'w', 1);
  // подсказки по управлению
  let x = 140 - (13 * 2 + 3 + 4 + textWidth('ДВИГАТЬСЯ', 1)) / 2, y = 84;
  x += drawKeycap(c, x, y, '←') + 2; x += drawKeycap(c, x, y, '→') + 5;
  drawTextO(c, 'ДВИГАТЬСЯ', x, y + 3, 'w', 1);
  if (!touchMode) {
    y = 99; const t1 = 'ПАУЗА', t2 = 'ЗВУК';
    x = 140 - (textWidth(t1) + textWidth(t2) + 13 * 2 + 10 + 8 + 8) / 2;
    x += drawKeycap(c, x, y, 'Р') + 3; drawTextO(c, t1, x, y + 3, 'w', 1); x += textWidth(t1) + 10;
    x += drawKeycap(c, x, y, 'М') + 3; drawTextO(c, t2, x, y + 3, 'w', 1);
  }
  if (blink(0.5)) { logoLine(c, touchMode ? 'КОСНИСЬ ЭКРАНА' : 'НАЖМИ ПРОБЕЛ', 140, 116, 2, 'y', 'r'); }
}
function drawOverlays(c) {
  if (G.state === 'title') drawTitle(c);
  else if (G.state === 'play' && G.readyT > 0 && blink(0.25)) logoLine(c, 'ГОТОВЬСЯ!', 140, 82, 2, 'y', 'r');
  else if (G.state === 'paused') {
    dim(c, 0.6);
    logoLine(c, 'ПАУЗА', 140, 56, 3, 'y', 'r');
    drawTextOC(c, touchMode ? 'КОСНИСЬ ЭКРАНА' : 'НАЖМИ Р ИЛИ ПРОБЕЛ', 140, 92, 'w', 1);
    drawTextOC(c, 'КАЖДЫЕ 1000 ОЧКОВ: +1 ЖИЗНЬ', 140, 108, 'y', 1);
    drawTextOC(c, 'КАЖДЫЕ 100 ОЧКОВ: ЗАКАЗ, +1 БЛЮДО', 140, 122, 'y', 1);
    drawTextOC(c, 'ЧЕТЫРЕ БЛЮДА: ОФИЦИАНТ ЗАБЕРЁТ ДВА', 140, 134, 'y', 1);
  } else if (G.state === 'over') {
    dim(c, 0.6);
    logoLine(c, 'КОНЕЦ ИГРЫ', 140, 30, 3, 'R', 'r');
    logoLine(c, 'ОЧКИ ' + pad(G.score, 6), 140, 66, 2, 'y', 'r');
    if (G.newRecord && G.score > 0) { if (blink(0.35)) logoLine(c, 'НОВЫЙ РЕКОРД!', 140, 88, 2, 'G', 'g'); }
    else drawTextOC(c, 'РЕКОРД ' + pad(G.hi, 6), 140, 92, 'w', 1);
    if (G.overT <= 0 && blink(0.5)) drawTextOC(c, touchMode ? 'КОСНИСЬ ЭКРАНА — ЕЩЁ РАЗ' : 'НАЖМИ ПРОБЕЛ — ЕЩЁ РАЗ', 140, 116, 'w', 1);
  }
  if (G.toast && G.state !== 'title') drawTextOC(c, G.toast.text, 140, G.toast.y, 'y', 2);
  else if (G.toast) drawTextOC(c, G.toast.text, 140, G.toast.y, 'y', 1);
}

function render() {
  const c = bx;
  if (G.state === 'harvest' || (G.state === 'paused' && G.resume === 'harvest')) {
    drawGarden(c); drawHarvestObjects(c); drawParticles(c); drawHarvestHud(c); drawHarvestOverlay(c);
  } else {
    drawScene(c, G.time);
    if (G.state === 'title') dim(c, 0.5);
    drawWaiters(c); drawCook(c); drawFoods(c); drawCat(c); drawParticles(c); drawCookShout(c);
    drawHud(c);
  }
  drawOverlays(c);
  drawFade(c);
  present();
}
function present() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#000'; ctx.fillRect(SX, SY, SW, SH);
  let ox = 0, oy = 0;
  if (G.shake > 0) { const m = G.shake / 0.3; ox = Math.round(rnd(-2, 2) * m); oy = Math.round(rnd(-2, 2) * m); }
  ctx.drawImage(buf, 0, 0, VW, VH, SX + ox * 3, SY + oy * 3, SW, SH);
  ctx.drawImage(TV, 0, 0);
}

/* ------------------------------ Запуск ------------------------------ */
function fit() {            // если окно браузера меньше 900×600 — уменьшаем экран целиком
  if (touchMode) { fitTouch(); return; }
  document.body.style.height = ''; tv.style.left = ''; tv.style.top = '';
  const room = window.innerHeight - hintEl.offsetHeight - 14 - 16;
  const s = Math.max(0.3, Math.min(1, (window.innerWidth - 16) / CW, room / CH));
  tv.style.width = Math.round(CW * s) + 'px'; tv.style.height = Math.round(CH * s) + 'px';
  tv.style.borderRadius = Math.round(46 * s) + 'px';
}
let lastTs = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  syncTouchUi();
  render();
}
function init() {
  buildSprites();
  BG = buildBackground();
  TV = buildTvOverlay();
  ctx.imageSmoothingEnabled = false; bx.imageSmoothingEnabled = false;
  initTouch();
  fit(); window.addEventListener('resize', fit);
  tv.focus(); tv.addEventListener('pointerdown', () => tv.focus());
  requestAnimationFrame(frame);
}
init();
</script>
